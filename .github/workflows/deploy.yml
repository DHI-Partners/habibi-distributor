name: Deploy

# Собирает статический образ (nginx + dist/) и пушит в ghcr.io.
#
# Триггеры:
#   push в main       — только сборка (обновляет :latest / :<sha>)
#   push tag v*       — сборка + ВЫКАТ на прод (job deploy)
#   workflow_dispatch — вручную из UI (только сборка)
#
# Выкат на прод происходит ТОЛЬКО по тегу v* — job deploy ниже с
# if github.ref_type == 'tag' && startsWith(github.ref_name, 'v').
# Пуш в main прод не трогает.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Нативный ARM-раннер: прод-сервер — Oracle Ampere (aarch64), и образ
    # обязан быть под ту же архитектуру, иначе docker на сервере откажется
    # его запускать ("image ... does not provide the specified platform").
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Владелец репозитория — DHI-Partners, с заглавными буквами, а docker
      # требует имя репозитория строго в нижнем регистре.
      - name: Resolve image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/habibi-distributor" >> "$GITHUB_ENV"
          echo "образ: ghcr.io/${owner}/habibi-distributor"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Релизный тег образа = имя git-тега (v1.0.0). Только при пуше тега;
      # для пуша в main строка пустая, и build-push-action её пропускает.
      # Этим тегом deploy помечает .env на сервере — читаемый якорь для
      # отката (v1.0.0, v1.0.1), в отличие от голого sha.
      - name: Release image tag
        id: reltag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "image_tag=${{ env.IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Явно, а не по архитектуре раннера: иначе замена раннера молча
          # меняет архитектуру образа, а узнаётся это только на сервере.
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ steps.reltag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итоговые теги
        run: |
          echo "архитектура: linux/arm64"
          echo "${{ env.IMAGE }}:latest"
          echo "${{ env.IMAGE }}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.IMAGE }}:${{ github.ref_name }}   <- релиз, поедет на прод"
          fi

  # ВЫКАТ НА ПРОД. Только по git-тегу v* (пуш в main сюда не попадает).
  # Заходит по SSH на сервер, переключает DISTRIB_TAG на имя тега и
  # перезапускает только сервис distrib — без bench backup/migrate,
  # у этого сервиса нет базы данных. Секреты HABIBI_* — те же, что у
  # ERP-воркфлоу в habibi_docker (org-level либо repo-level копии).
  deploy:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HABIBI_HOST }}
          username: ${{ secrets.HABIBI_USER }}
          key: ${{ secrets.HABIBI_SSH_KEY }}
          script: |
            set -e
            cd ~/habibi_docker

            cp .env .env.bak-$(date +%Y%m%d-%H%M%S)
            sed -i "s|^DISTRIB_TAG=.*|DISTRIB_TAG=${{ github.ref_name }}|" .env
            grep '^DISTRIB_TAG=' .env

            docker compose pull distrib
            docker compose up -d distrib
            docker image prune -f

            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://distrib.habibi-erp.com/ || true)
            echo "сайт после выката: HTTP $code"
            test "$code" = "200"
